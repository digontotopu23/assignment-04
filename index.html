<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">


    <style>
        * {
            font-family: "Geist", sans-serif;
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen">
    <div class="max-w-6xl mx-auto p-6">
        <!--Dashboard-->
        <h1 class="text-2xl font-bold mb-4">Job Application Tracker</h1>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-5">
            <div class="bg-white p-4 rounded shadow">
                <p class="text-gray-500 text-sm">Total</p>
                <h2 id="totalCount" class="text-2xl font-bold">8</h2>
            </div>

            <div class="bg-white p-4 rounded shadow">
                <p class="text-gray-500 text-sm">Interview</p>
                <h2 id="interviewCount" class="text-2xl font-bold text-green-600">0</h2>
            </div>

            <div class="bg-white p-4 rounded shadow">
                <p class="text-gray-500 text-sm">Rejected</p>
                <h2 id="rejectedCount" class="text-2xl font-bold text-red-600">0</h2>
            </div>
        </div>
     <hr class="border-gray-300 opacity-40 my-5">
        <!--Available jobs-->
        <div class="max-w-6xl mx-auto flex justify-between items-center mb-3">
            <h2>Available Jobs</h2>
            <span id="tabCount" class="text-sm text-gray-500">8 Jobs</span>
        </div>
        <!--Tabs-->
        <div class="flex gap-2 mb-6">
            <button class="tab-btn bg-blue-600 text-white px-4 py-1 rounded">All</button>
            <button class="tab-btn bg-gray-200 px-4 py-1 rounded">Interview</button>
            <button class="tab-btn bg-gray-200 px-4 py-1 rounded">Rejected</button>
        </div>

        <!--Cards container-->
        <div id="jobsContainer" class="space-y-4"></div>
        <div id="noJobs" class="hidden bg-white p-10 text-center rounded shadow">
             <div class="flex justify-center mb-4"><img src="jobs.png" alt="jobs" class="w-20 h-20 object-contain"></div>
            <h3 class="font-semibold text-lg">No jobs available</h3>
            <p class="text-gray-500 text-sm">Check back soon for new job opportunities</p>
        </div>
       

    </div>
      

      <script src="script.js"></script>
</body>

</html>
